[project]
name = "zoom-icebreaker"
version = "1.0.0"
description = "Live tracker for who has introduced themselves in a Zoom meeting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0 ; sys_platform == 'darwin'",
    "uiautomation>=2.0 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "bandit>=1.7",
    "lizard>=1.17",
    "pymarkdownlnt>=0.9",
    "pre-commit>=3.7",
    "pytest>=8.0",
]

# --- Tool configuration ---------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = [".venv", ".git", "tests"]
# B104: binding to 0.0.0.0 — we explicitly bind to 127.0.0.1 only, so no issue
# B311: pseudo-random — not used cryptographically
# tests/ excluded: `assert` (B101) is required by pytest; urlopen against the
# local test server (B310) and random for shuffling are safe in test context.

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.line-length.line_length = 100
plugins.no-inline-html.enabled = false
plugins.first-line-heading.enabled = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
