name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: pytest
        run: uv run pytest

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: bandit
        run: uv run bandit -r tracker.py ax_dump.py -c pyproject.toml

      - name: lizard
        run: uv run lizard tracker.py ax_dump.py --CCN 10 --length 100 -w

      - name: pymarkdown
        run: uv run pymarkdown -d md013 scan README.md

      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      - name: Install web dev dependencies
        run: npm ci
      - name: vitest (unit + jsdom integration, with coverage)
        run: npm run coverage
      - name: biome (js/css lint + format check)
        run: npx --yes @biomejs/biome@2.4.16 ci .
      - name: html-validate (html structure / a11y)
        run: npx --yes html-validate@11.5.2 index.html
      - name: fallow (dead code, duplication, complexity; coverage-aware CRAP)
        run: npx --yes fallow@2.88.3 audit --base origin/main --coverage coverage/coverage-final.json
