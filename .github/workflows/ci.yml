name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The suite is what has to prove itself on every supported OS/Python; the
  # quality gates below are platform-independent, so they live in their own
  # single-runner job rather than repeating a matrix condition per step.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --dev

      - name: pytest
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: bandit
        run: uv run bandit -r tracker.py ax_dump.py -c pyproject.toml

      - name: pip-audit
        run: uv run pip-audit --skip-editable

      - name: lizard
        run: uv run lizard tracker.py ax_dump.py --CCN 10 --length 100 -w

      - name: pymarkdown
        run: uv run pymarkdown -d md013 scan README.md

      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
      - name: Install web dev dependencies
        run: npm ci
      - name: npm audit (dependency CVEs)
        run: npm audit --audit-level=high
      - name: vitest (unit + jsdom integration, with coverage)
        run: npm run coverage
      - name: biome (js/css lint + format check)
        run: npx --yes @biomejs/biome@2.5.5 ci .
      - name: html-validate (html structure / a11y)
        run: npx --yes html-validate@11.5.6 index.html
      - name: fallow (dead code, duplication, complexity; coverage-aware CRAP)
        run: npx --yes fallow@3.7.1 audit --base origin/main --coverage coverage/coverage-final.json
