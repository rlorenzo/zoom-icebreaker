name: Deploy to GitHub Pages

# Publishes the backend-less build of the UI. app.js probes for a server at
# startup; on Pages there is none, so it runs the local in-browser engine
# (manual entry + localStorage). No Python, tests, or docs are shipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight deploy at a time; never cancel a running one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html styles.css app.js roster.js demo.js engine.js session.js _site/
          # The typeface is self-hosted (see styles.css); without this the
          # hosted build 404s the woff2 and silently drops to system-ui.
          cp -R fonts _site/fonts
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v3.0.1
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
