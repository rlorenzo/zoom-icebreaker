<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Icebreaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:     #faf7f2;
    --surface:   #f3eee5;
    --hairline:  #ddd3c2;
    --soft-line: #c8bca6;
    --muted-ink: #807666;
    --dim-ink:   #4a4036;
    --ink:       #28201a;
    --clay:      #c9573a;
    --clay-deep: #a44128;

    --rounded-xs: 6px;
    --rounded-sm: 10px;

    --t-fast:   140ms cubic-bezier(0.22, 1, 0.36, 1);
    --t-medium: 200ms cubic-bezier(0.22, 1, 0.36, 1);

    font-family: "Geist", "Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--paper); }
  body {
    color: var(--ink);
    min-height: 100vh;
    padding: 5vh 5vw;
    font-size: 0.9375rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  /* Header --------------------------------------------------------- */
  header { margin-bottom: 40px; }

  .meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 0.8125rem; color: var(--muted-ink);
    margin-bottom: 22px;
  }
  .meta b { color: var(--dim-ink); font-weight: 500; }
  .meta .sep { color: var(--hairline); }

  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--clay); flex: none;
    box-shadow: 0 0 0 0 rgba(201, 87, 58, .45);
    animation: pulse 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 9px rgba(201, 87, 58, 0); }
    100% { box-shadow: 0 0 0 0 rgba(201, 87, 58, 0); }
  }

  .prompt-sticky {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    padding: 14px 0 12px;
    margin: -14px 0 10px;
    border-bottom: 1px solid transparent;
    transition: border-color var(--t-fast);
  }
  .prompt-sticky.is-pinned {
    border-bottom-color: var(--hairline);
  }

  .prompt {
    display: block; width: 100%;
    font-family: inherit;
    font-size: clamp(2rem, 3.4vw, 2.75rem);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.015em;
    color: var(--ink);
    background: transparent;
    border: 0; padding: 0; margin: 0;
    resize: none; overflow: hidden;
    outline: none;
  }
  .prompt::placeholder { color: var(--soft-line); font-weight: 500; }
  .prompt:focus-visible {
    outline: 2px solid var(--clay);
    outline-offset: 6px;
    border-radius: 2px;
  }

  /* Stats ---------------------------------------------------------- */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px; margin-bottom: 28px;
  }
  .stat {
    background: var(--surface);
    border-radius: var(--rounded-sm);
    padding: 16px 20px;
  }
  .stat .n {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 2.25rem; font-weight: 500;
    line-height: 1; letter-spacing: -0.01em;
    font-feature-settings: 'tnum' 1;
    color: var(--ink);
  }
  .stat .l {
    margin-top: 10px;
    font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted-ink);
  }

  /* Coming-up callout ---------------------------------------------- */
  .callout {
    background: var(--surface);
    border-radius: var(--rounded-sm);
    padding: 14px 20px; margin-bottom: 22px;
    font-size: 1rem; line-height: 1.5;
    color: var(--dim-ink);
  }
  .callout b { color: var(--ink); font-weight: 500; }
  .callout .lead {
    color: var(--muted-ink); font-weight: 500;
    margin-right: 4px;
  }

  /* Roster --------------------------------------------------------- */
  .roster { display: flex; flex-direction: column; gap: 8px; }

  .row {
    position: relative;
    display: grid;
    grid-template-columns: 40px 1fr auto auto auto;
    align-items: center; gap: 14px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: var(--rounded-sm);
    padding: 14px 18px;
    transition: background var(--t-fast), border-color var(--t-fast),
                color var(--t-fast), transform var(--t-medium);
    outline: none;
  }
  .row[draggable="true"] { cursor: grab; }
  .row.dragging { opacity: 0.4; cursor: grabbing; }
  .row:focus-visible {
    outline: 2px solid var(--clay);
    outline-offset: 2px;
  }

  .row.host {
    border-color: var(--soft-line);
    cursor: default;
  }

  .row.introduced {
    background: var(--surface);
    color: var(--muted-ink);
  }

  .row.left { color: var(--dim-ink); }

  /* Up-next: a quiet hand to the next speaker. ---------------------- */
  .row.up-next {
    border-color: oklch(58% 0.14 38 / 0.45);
  }
  .row.up-next .pos {
    color: var(--clay);
    font-weight: 600;
  }
  .up-next-tag {
    font-size: 0.6875rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: lowercase;
    color: var(--clay);
    flex: none;
  }

  /* Completion gesture: clay-tinted settle, then surface. ----------- */
  @keyframes mark-flash {
    0%   { background-color: oklch(93% 0.045 38); }
    60%  { background-color: oklch(95% 0.02 38); }
    100% { background-color: var(--surface); }
  }
  @keyframes draw-check {
    from { stroke-dashoffset: 100; }
    to   { stroke-dashoffset: 0; }
  }
  @keyframes pos-cue {
    0%   { transform: scale(1);    opacity: 0.55; }
    45%  { transform: scale(1.22); opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  .row.just-introduced {
    animation: mark-flash 3000ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .row.just-introduced .toggle .check path {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw-check 1000ms cubic-bezier(0.22, 1, 0.36, 1) 800ms forwards;
  }
  .row.up-next.just-cued .pos {
    transform-origin: center right;
    animation: pos-cue 520ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Drop indicators (insertion line) */
  .row::before {
    content: "";
    position: absolute; left: 0; right: 0;
    height: 2px; background: var(--clay);
    pointer-events: none;
    opacity: 0;
    transition: opacity var(--t-fast);
  }
  .row.drop-before::before { top: -5px; opacity: 1; }
  .row.drop-after::before { bottom: -5px; opacity: 1; }

  .pos {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 1.125rem; font-weight: 500;
    color: var(--muted-ink);
    font-feature-settings: 'tnum' 1;
    text-align: right;
    user-select: none;
  }
  .row.introduced .pos { color: var(--soft-line); }
  .pos.left-mark { color: var(--soft-line); }

  .name {
    display: flex; align-items: baseline; gap: 10px;
    min-width: 0;
    font-size: 1.0625rem; font-weight: 500;
    color: inherit;
  }
  .row:not(.introduced) .name { color: var(--ink); }
  .name .who {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .host-pill {
    flex: none;
    font-size: 0.6875rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: lowercase;
    color: var(--clay);
    padding: 4px 6px;
  }

  .check {
    width: 14px; height: 14px;
    flex: none; color: var(--muted-ink);
  }

  .when {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 0.8125rem; color: var(--muted-ink);
    font-feature-settings: 'tnum' 1;
    flex: none;
  }
  .row.introduced .when { color: var(--soft-line); }

  .tag {
    font-size: 0.6875rem; letter-spacing: 0.06em;
    color: var(--muted-ink);
    border: 1px solid var(--hairline);
    padding: 2px 8px; border-radius: 999px;
    flex: none;
  }

  .toggle {
    flex: none;
    font-family: inherit;
    font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.04em;
    padding: 8px 14px;
    border-radius: var(--rounded-xs);
    border: 1px solid var(--hairline);
    background: var(--paper);
    color: var(--muted-ink);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background var(--t-fast), color var(--t-fast),
                border-color var(--t-fast);
  }
  .toggle:hover { border-color: var(--soft-line); color: var(--ink); }
  .toggle.on {
    background: var(--ink); color: var(--paper);
    border-color: var(--ink);
  }
  .toggle.on:hover { background: var(--dim-ink); border-color: var(--dim-ink); }
  .toggle.on .check { color: var(--paper); }
  .toggle:focus-visible {
    outline: 2px solid var(--clay); outline-offset: 2px;
  }

  .x {
    flex: none;
    background: none; border: 0; padding: 6px;
    color: var(--soft-line); cursor: pointer;
    display: inline-flex; align-items: center;
    border-radius: var(--rounded-xs);
    transition: color var(--t-fast), background var(--t-fast);
  }
  .x:hover { color: var(--clay-deep); background: var(--surface); }
  .x:focus-visible {
    outline: 2px solid var(--clay); outline-offset: 2px;
  }

  .empty {
    color: var(--muted-ink); padding: 56px 0;
    text-align: center; font-size: 0.9375rem;
    border: 1px dashed var(--hairline);
    border-radius: var(--rounded-sm);
  }

  /* Footer --------------------------------------------------------- */
  footer {
    margin-top: 32px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center; gap: 20px;
  }
  .add-row {
    display: flex; align-items: center; gap: 8px;
    min-width: 0;
  }
  .footer-actions {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; justify-content: flex-end;
  }

  input {
    font-family: inherit; font-size: 0.9375rem;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--hairline);
    padding: 10px 14px; border-radius: var(--rounded-xs);
    flex: 1; min-width: 0;
    transition: border-color var(--t-fast);
  }
  input::placeholder { color: var(--muted-ink); }
  input:focus { outline: none; border-color: var(--clay); }

  .btn {
    font-family: inherit;
    font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.04em;
    padding: 10px 16px;
    border-radius: var(--rounded-xs);
    border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper);
    cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast),
                color var(--t-fast);
  }
  .btn:hover { background: var(--dim-ink); border-color: var(--dim-ink); }
  .btn:focus-visible {
    outline: 2px solid var(--clay); outline-offset: 2px;
  }

  .btn.ghost {
    background: var(--paper); color: var(--dim-ink);
    border-color: var(--hairline);
  }
  .btn.ghost:hover {
    background: var(--surface); color: var(--ink);
    border-color: var(--soft-line);
  }

  /* Reduced motion ------------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
    .dot { animation: none; box-shadow: none; }
  }

  /* Narrow screens ------------------------------------------------- */
  @media (max-width: 640px) {
    body { padding: 4vh 4vw; }
    .stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat { padding: 12px 14px; }
    .stat .n { font-size: 1.75rem; }
    .row {
      grid-template-columns: 28px 1fr auto auto;
      gap: 10px;
      padding: 12px 14px;
    }
    .row .when { display: none; }
    .row .x { padding: 4px; }
    .toggle { padding: 7px 10px; }
    .pos { font-size: 1rem; }
    footer { grid-template-columns: 1fr; gap: 12px; }
    .footer-actions { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="meta">
      <span class="dot" aria-hidden="true"></span>
      <span id="live">live</span>
      <span class="sep" aria-hidden="true">·</span>
      <span>Started <b id="since">··</b></span>
    </div>
  </header>

  <div class="prompt-sticky" id="promptSticky">
    <textarea
      id="prompt"
      class="prompt"
      rows="1"
      maxlength="240"
      placeholder="Set an icebreaker prompt&hellip;"
      aria-label="Icebreaker prompt"
      spellcheck="true"
    ></textarea>
  </div>

  <div class="stats" aria-label="Counts">
    <div class="stat">
      <div class="n" id="s-present">0</div>
      <div class="l">In the room</div>
    </div>
    <div class="stat">
      <div class="n" id="s-done">0</div>
      <div class="l">Introduced</div>
    </div>
    <div class="stat">
      <div class="n" id="s-wait">0</div>
      <div class="l">Still to go</div>
    </div>
  </div>

  <div id="calloutBox"></div>

  <div class="roster" id="roster" aria-live="polite"></div>

  <footer>
    <form class="add-row" id="addForm" autocomplete="off">
      <input id="addName" placeholder="Add someone manually&hellip;" aria-label="Add participant by name" />
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="footer-actions">
      <button class="btn ghost" id="randomBtn" type="button">Randomize order</button>
      <button class="btn ghost" id="resetBtn" type="button">Reset session</button>
    </div>
  </footer>
</div>

<script>
  // ---- icons (inline so a single file ships) -----------------------
  const ICON_CHECK = `<svg class="check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7" pathLength="100"/></svg>`;
  const ICON_X = `<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>`;

  // ---- formatters --------------------------------------------------
  const fmtTime = ts =>
    new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- state cache & helpers --------------------------------------
  let state = { participants: [], prompt: "", startedAt: Date.now() };
  let lastFocusPid = null;          // re-focus this row after the next render
  let dragPid = null;
  let dropTargetPid = null;
  let dropBefore = true;

  const $ = id => document.getElementById(id);
  const stateById = pid => state.participants.find(p => p.id === pid);
  const hostFirst = () => state.participants[0] && state.participants[0].is_host;

  // ---- API ---------------------------------------------------------
  async function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
  }
  const postOrder = order => post("/api/order", { order });
  const setIntroduced = (id, v) => post(`/api/participant/${id}/introduced`, { introduced: v });
  const removeP = id => post(`/api/participant/${id}/remove`);
  const sendPrompt = prompt => post("/api/prompt", { prompt });
  const randomize = () => post("/api/randomize");
  const resetSession = () => post("/api/reset");
  const addPerson = name => post("/api/participant", { name });

  // ---- prompt textarea --------------------------------------------
  const promptEl = $("prompt");
  function autosize(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  promptEl.addEventListener("input", () => autosize(promptEl));
  promptEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); promptEl.blur(); }
    if (e.key === "Escape") {
      promptEl.value = state.prompt || "";
      autosize(promptEl);
      promptEl.blur();
    }
  });
  promptEl.addEventListener("blur", () => {
    const next = promptEl.value.trim();
    if (next === (state.prompt || "").trim()) return;
    sendPrompt(next);
  });
  window.addEventListener("resize", () => autosize(promptEl));

  // Toggle a subtle hairline under the sticky prompt only when pinned.
  const promptSticky = $("promptSticky");
  const pinSentinel = document.createElement("div");
  pinSentinel.style.cssText = "position:absolute;top:0;height:1px;width:1px;";
  promptSticky.before(pinSentinel);
  new IntersectionObserver(
    ([entry]) => promptSticky.classList.toggle("is-pinned", !entry.isIntersecting),
    { threshold: 0 },
  ).observe(pinSentinel);

  // Sort: host (not yet introduced) first, then waiting,
  // then anyone introduced (including the host), then people who've
  // left. Stable, so backend order is preserved within each bucket.
  function sortForDisplay(participants) {
    const rank = p => {
      if (!p.present) return 3;
      if (p.introduced) return 2;
      if (p.is_host) return 0;
      return 1;
    };
    return [...participants].sort((a, b) => rank(a) - rank(b));
  }

  // Up-next = the first present, not-yet-introduced person (the host
  // counts if they haven't gone yet). Used both for row styling and
  // for the baton-pass cue between renders.
  function findUpNextPid(participants) {
    const up = participants.find(p => p.present && !p.introduced);
    return up ? up.id : null;
  }

  const reduceMotion = () =>
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // FLIP: capture row top offsets before innerHTML rewrites the roster,
  // then after the new DOM lands, animate each surviving row from its
  // old position to its new one. Web Animations API bypasses the row's
  // CSS transition, which we want — it would otherwise fight the slide.
  function captureRowTops(roster) {
    const m = new Map();
    for (const r of roster.querySelectorAll(".row[data-pid]")) {
      m.set(r.dataset.pid, r.getBoundingClientRect().top);
    }
    return m;
  }
  function playReorder(roster, oldTops) {
    if (reduceMotion()) return;
    for (const r of roster.querySelectorAll(".row[data-pid]")) {
      const oldTop = oldTops.get(r.dataset.pid);
      if (oldTop == null) continue;
      const dy = oldTop - r.getBoundingClientRect().top;
      if (Math.abs(dy) < 2) continue;
      r.animate(
        [{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }],
        { duration: 2400, easing: "cubic-bezier(0.22, 1, 0.36, 1)" },
      );
    }
  }

  // ---- render ------------------------------------------------------
  function render(s) {
    // Assign stable position numbers from the BACKEND order (host first,
    // then non-host in arrival/drag order). Once a person has a number,
    // it sticks even after they introduce themselves and fall to the
    // bottom — so "the host went first" still reads as "1".
    const positionByPid = new Map();
    let pos = 0;
    for (const p of s.participants) {
      if (p.present) positionByPid.set(p.id, ++pos);
    }

    s = { ...s, participants: sortForDisplay(s.participants) };

    // Diff against the previous state BEFORE we overwrite it — that's
    // how we know which rows just transitioned and where they came from.
    const prevIntroduced = new Set(
      (state.participants || [])
        .filter(p => p.introduced && p.present)
        .map(p => p.id),
    );
    const prevUpNextPid = findUpNextPid(state.participants || []);
    const roster = $("roster");
    const oldTops = captureRowTops(roster);

    state = s;

    $("since").textContent = fmtTime(s.startedAt);

    if (document.activeElement !== promptEl) {
      promptEl.value = s.prompt || "";
      autosize(promptEl);
    }

    const present = s.participants.filter(p => p.present);
    const done = s.participants.filter(p => p.introduced && p.present);
    const waiting = present.filter(p => !p.introduced);

    $("s-present").textContent = present.length;
    $("s-done").textContent = done.length;
    $("s-wait").textContent = waiting.length;

    // Coming-up callout
    const callout = $("calloutBox");
    if (waiting.length > 0) {
      const lead = escapeHtml(waiting[0].name);
      const rest = waiting.slice(1).map(p => escapeHtml(p.name));
      let body;
      if (rest.length === 0) body = `<b>${lead}</b>.`;
      else if (rest.length === 1) body = `<b>${lead}</b>, then ${rest[0]}.`;
      else body = `<b>${lead}</b>, then ${rest.join(", ")}.`;
      callout.innerHTML =
        `<div class="callout"><span class="lead">Coming up:</span>${body}</div>`;
    } else if (present.length > 0) {
      callout.innerHTML =
        `<div class="callout">Everyone has introduced themselves.</div>`;
    } else {
      callout.innerHTML = "";
    }

    // Roster
    const upNextPid = findUpNextPid(s.participants);
    const upNextChanged = upNextPid && upNextPid !== prevUpNextPid;
    if (!s.participants.length) {
      roster.innerHTML =
        `<div class="empty">No one yet. Joins will appear automatically, or add someone below.</div>`;
    } else {
      roster.innerHTML = s.participants.map(p => {
        const num = positionByPid.get(p.id) ?? "";
        const justIntroduced = p.introduced && p.present
          && !prevIntroduced.has(p.id);
        const isUpNext = p.id === upNextPid;
        const cls = [
          "row",
          p.is_host ? "host" : "",
          p.introduced ? "introduced" : "",
          p.present ? "" : "left",
          isUpNext ? "up-next" : "",
          isUpNext && upNextChanged ? "just-cued" : "",
          justIntroduced ? "just-introduced" : "",
        ].filter(Boolean).join(" ");
        const hostBit = p.is_host
          ? `<span class="host-pill">host</span>`
          : "";
        const reorderable = !p.is_host && p.present && !p.introduced;
        const draggable = reorderable ? 'draggable="true"' : '';
        const tabAttr = reorderable ? 'tabindex="0"' : '';
        const toggleLabel = p.introduced
          ? `${ICON_CHECK}<span>Introduced</span>`
          : `<span>Mark introduced</span>`;
        const leftTag = p.present ? "" : `<span class="tag">left</span>`;
        const upNextTag = isUpNext && !p.is_host
          ? `<span class="up-next-tag">up next</span>` : "";
        return `
          <div class="${cls}" data-pid="${p.id}" ${draggable} ${tabAttr}>
            <div class="pos">${num}</div>
            <div class="name">
              <span class="who">${escapeHtml(p.name)}</span>
              ${hostBit}
              ${upNextTag}
              ${leftTag}
            </div>
            <div class="when">${fmtTime(p.joinTime)}</div>
            <button class="toggle ${p.introduced ? "on" : ""}" type="button"
                    data-act="toggle" data-pid="${p.id}" data-val="${!p.introduced}">
              ${toggleLabel}
            </button>
            <button class="x" type="button" data-act="remove" data-pid="${p.id}"
                    aria-label="Remove ${escapeHtml(p.name)}">${ICON_X}</button>
          </div>`;
      }).join("");
      playReorder(roster, oldTops);
    }

    // Restore focus to row moved by keyboard
    if (lastFocusPid) {
      const el = document.querySelector(`.row[data-pid="${lastFocusPid}"]`);
      if (el) el.focus();
      lastFocusPid = null;
    }
  }

  // ---- click delegation -------------------------------------------
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const pid = t.dataset.pid;
    switch (t.dataset.act) {
      case "toggle":    setIntroduced(pid, t.dataset.val === "true"); break;
      case "remove":    removeP(pid); break;
    }
  });
  // ---- drag and drop ----------------------------------------------
  const roster = $("roster");

  function clearDropIndicators() {
    document.querySelectorAll(".row.drop-before, .row.drop-after")
      .forEach(el => el.classList.remove("drop-before", "drop-after"));
  }

  roster.addEventListener("dragstart", e => {
    const row = e.target.closest(".row");
    if (!row) return;
    const pid = row.dataset.pid;
    const p = stateById(pid);
    if (!p || p.is_host || !p.present || p.introduced) { e.preventDefault(); return; }
    dragPid = pid;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", pid);
    row.classList.add("dragging");
  });

  roster.addEventListener("dragend", e => {
    const row = e.target.closest(".row");
    if (row) row.classList.remove("dragging");
    clearDropIndicators();
    dragPid = null;
    dropTargetPid = null;
  });

  roster.addEventListener("dragover", e => {
    if (!dragPid) return;
    const row = e.target.closest(".row");
    if (!row) return;
    e.preventDefault();
    const pid = row.dataset.pid;
    if (pid === dragPid) return;
    const target = stateById(pid);
    if (!target || (target.introduced && !target.is_host)) return;
    clearDropIndicators();
    // Dropping on the host row is always interpreted as "after host".
    const rect = row.getBoundingClientRect();
    const before = target.is_host
      ? false
      : e.clientY < rect.top + rect.height / 2;
    row.classList.add(before ? "drop-before" : "drop-after");
    dropTargetPid = pid;
    dropBefore = before;
  });

  roster.addEventListener("drop", e => {
    if (!dragPid) return;
    e.preventDefault();
    clearDropIndicators();
    const targetPid = dropTargetPid;
    const moving = dragPid;
    dragPid = null;
    dropTargetPid = null;
    if (!targetPid) return;

    const order = state.participants.map(p => p.id);
    const fromIdx = order.indexOf(moving);
    if (fromIdx < 0) return;
    order.splice(fromIdx, 1);
    let toIdx = order.indexOf(targetPid);
    if (toIdx < 0) return;
    order.splice(dropBefore ? toIdx : toIdx + 1, 0, moving);
    postOrder(order);
  });

  // ---- keyboard reorder -------------------------------------------
  roster.addEventListener("keydown", e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    const row = e.target.closest(".row");
    if (!row || row !== e.target) return;
    const pid = row.dataset.pid;
    const p = stateById(pid);
    if (!p || p.is_host || p.introduced) return;
    e.preventDefault();
    const order = state.participants.map(x => x.id);
    const fromIdx = order.indexOf(pid);
    const toIdx = e.key === "ArrowUp" ? fromIdx - 1 : fromIdx + 1;
    const minIdx = hostFirst() ? 1 : 0;
    if (toIdx < minIdx || toIdx >= order.length) return;
    order.splice(fromIdx, 1);
    order.splice(toIdx, 0, pid);
    lastFocusPid = pid;
    postOrder(order);
  });

  // ---- footer actions ---------------------------------------------
  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const input = $("addName");
    const name = input.value.trim();
    if (!name) return;
    input.value = "";
    await addPerson(name);
  });
  $("randomBtn").addEventListener("click", () => randomize());
  $("resetBtn").addEventListener("click", () => {
    if (confirm("Clear all participants and start over? The prompt is kept."))
      resetSession();
  });

  // ---- live stream -------------------------------------------------
  let last = null;
  const es = new EventSource("/events");
  es.onmessage = e => { last = JSON.parse(e.data); render(last); };
  es.onerror = () => { $("live").textContent = "reconnecting"; };
  es.onopen  = () => { $("live").textContent = "live"; };
</script>
</body>
</html>
