<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Icebreaker</title>
<!-- No third-party requests: the page is private by design (see README), so
     the typeface is vendored in fonts/ and served from this origin (see the
     @font-face rules in styles.css) rather than fetched from a CDN.
     Preloaded because @font-face is only discovered after styles.css parses,
     which puts the roster's own typeface a round-trip behind the text it sets.
     `crossorigin` is required even same-origin: fonts fetch in CORS mode. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/atkinson-next-var-latin.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="fonts/atkinson-mono-var-latin.woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <div class="demo-bar" id="demoBar" hidden>
    <div class="demo-bar-label">
      <span class="demo-bar-dot" aria-hidden="true"></span>
      <span class="demo-bar-title">Demo mode</span>
      <span class="demo-bar-note">Sample data you can play with. Nothing is saved.</span>
    </div>
    <button class="btn ghost" type="button" data-act="exit-demo">Exit demo</button>
  </div>

  <header>
    <div class="meta">
      <span class="dot" aria-hidden="true"></span>
      <span id="live" aria-live="polite">live</span>
      <span class="sep" aria-hidden="true">·</span>
      <span>Started <b id="since">··</b></span>
    </div>
  </header>

  <div class="prompt-sticky" id="promptSticky">
    <textarea
      id="prompt"
      class="prompt"
      rows="1"
      maxlength="240"
      placeholder="Set an icebreaker prompt&hellip;"
      aria-label="Icebreaker prompt"
      spellcheck="true"
    ></textarea>
  </div>

  <main>
    <h1 class="sr-only">Icebreaker tracker</h1>

    <!-- Not a live region. The counts are a summary of the roster below, and
         announcing all three on every change buried the one fact that actually
         changed; #srStatus speaks that single sentence instead. -->
    <div class="stats" role="group" aria-label="Counts">
      <div class="stat">
        <div class="n" id="s-present">0</div>
        <div class="l">In the room</div>
      </div>
      <div class="stat">
        <div class="n" id="s-done">0</div>
        <div class="l">Introduced</div>
      </div>
      <div class="stat">
        <div class="n" id="s-wait">0</div>
        <div class="l">Still to go</div>
      </div>
    </div>

    <div id="calloutBox" role="status"></div>

    <!-- A real list, and not a live region: app.js rewrites this wholesale on
         every frame, so aria-live here re-read the entire roster on each change
         (and the Zoom poller can fire that every 5s). -->
    <ul class="roster" id="roster"></ul>

    <!-- One sentence per change, for assistive tech only. -->
    <p class="sr-only" id="srStatus" role="status" aria-live="polite"></p>
    <p class="sr-only" id="reorderHint">
      Press the up or down arrow key to move this person in the order.
    </p>
  </main>

  <footer>
    <form class="add-row" id="addForm" autocomplete="off">
      <input id="addName" type="text" placeholder="Add someone manually&hellip;" aria-label="Add participant by name" />
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="footer-actions">
      <button class="btn ghost" id="randomBtn" type="button">Randomize order</button>
      <button class="btn ghost" id="resetBtn" type="button">Reset session</button>
    </div>
  </footer>

  <div class="sponsor-bar">
    <!-- A plain link, not the sponsors iframe: an embedded iframe phones
         github.com on every page load, which the privacy promise rules out. -->
    <a class="sponsor" href="https://github.com/sponsors/rlorenzo" target="_blank" rel="noopener noreferrer">&#9825; Sponsor this project</a>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
