<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Icebreaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <header>
    <div class="meta">
      <span class="dot" aria-hidden="true"></span>
      <span id="live">live</span>
      <span class="sep" aria-hidden="true">·</span>
      <span>Started <b id="since">··</b></span>
    </div>
  </header>

  <div class="prompt-sticky" id="promptSticky">
    <textarea
      id="prompt"
      class="prompt"
      rows="1"
      maxlength="240"
      placeholder="Set an icebreaker prompt&hellip;"
      aria-label="Icebreaker prompt"
      spellcheck="true"
    ></textarea>
  </div>

  <div class="stats" aria-label="Counts">
    <div class="stat">
      <div class="n" id="s-present">0</div>
      <div class="l">In the room</div>
    </div>
    <div class="stat">
      <div class="n" id="s-done">0</div>
      <div class="l">Introduced</div>
    </div>
    <div class="stat">
      <div class="n" id="s-wait">0</div>
      <div class="l">Still to go</div>
    </div>
  </div>

  <div id="calloutBox"></div>

  <div class="roster" id="roster" aria-live="polite"></div>

  <footer>
    <form class="add-row" id="addForm" autocomplete="off">
      <input id="addName" placeholder="Add someone manually&hellip;" aria-label="Add participant by name" />
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="footer-actions">
      <button class="btn ghost" id="randomBtn" type="button">Randomize order</button>
      <button class="btn ghost" id="resetBtn" type="button">Reset session</button>
    </div>
  </footer>

  <div class="sponsor-bar">
    <iframe
      class="sponsor"
      src="https://github.com/sponsors/rlorenzo/button"
      title="Sponsor rlorenzo"
      height="32"
      width="114"
      loading="lazy"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
    ></iframe>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
