<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Icebreaker</title>
<!-- No third-party requests: the page is private by design (see README), so
     the typeface is vendored in fonts/ and served from this origin (see the
     @font-face rules in styles.css) rather than fetched from a CDN.
     Preloaded because @font-face is only discovered after styles.css parses,
     which puts the roster's own typeface a round-trip behind the text it sets.
     `crossorigin` is required even same-origin: fonts fetch in CORS mode. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/atkinson-next-var-latin.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="fonts/atkinson-mono-var-latin.woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
<script>
  // Re-apply the saved theme before first paint so a host who chose Dawn,
  // Golden Hour, or After Dark never sees the default sky flash in. Inline and
  // synchronous on purpose — theme.js (a deferred module) owns everything
  // else; this is only the anti-flash mirror of its whitelist. A blocked
  // localStorage degrades to the default theme, which is fine.
  try {
    var savedTheme = localStorage.getItem("icebreaker.theme");
    if (savedTheme === "dawn" || savedTheme === "dusk" || savedTheme === "night") {
      document.documentElement.dataset.theme = savedTheme;
    }
  } catch (e) {
    /* storage unavailable — the clear sky is the fallback */
  }
</script>
</head>
<body>
<!--
THESIS: The round-robin tracker as a clear California day — one deep-blue
masthead holds the question, gold marks whoever holds the baton. Refuses the
beige ledger it replaces and the navy-dashboard reflex alike.
OWN-WORLD: Sky-tinted ground (#f4f9fd), white rows, deep blue #005581 owning
the full-bleed prompt band and every primary control; gold #ffb511 reserved
for the happy moments (up next, completion, demo); Atkinson Hyperlegible.
STORY: The room glances, finds the gold row, knows who's next; the host clicks
"Mark introduced" and the gold settles onto the next person.
FIRST VIEWPORT: Blue band with live meta + display-size prompt; three counts
in deep blue; roster with the gold up-next row inside a blue frame.
FORM: brief-pinned (UC-guidelines spirit, no branding); roll not run per the
pin rule.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, DESIGN.md, and every shipping raster carrying its
provenance.
-->
<div class="wrap">
  <div class="demo-bar" id="demoBar" hidden>
    <div class="demo-bar-label">
      <span class="demo-bar-dot" aria-hidden="true"></span>
      <span class="demo-bar-title">Demo mode</span>
      <span class="demo-bar-note">Sample data you can play with. Nothing is saved.</span>
    </div>
    <button class="btn ghost" type="button" data-act="exit-demo">Exit demo</button>
  </div>

  <header>
    <div class="meta">
      <span class="dot" aria-hidden="true"></span>
      <span id="live" aria-live="polite">live</span>
      <span class="sep" aria-hidden="true">·</span>
      <span>Started <b id="since">··</b></span>
    </div>
  </header>

  <div class="prompt-sticky" id="promptSticky">
    <textarea
      id="prompt"
      class="prompt"
      rows="1"
      maxlength="240"
      placeholder="Ask the room something fun&hellip;"
      aria-label="Icebreaker prompt"
      spellcheck="true"
    ></textarea>
  </div>

  <main>
    <h1 class="sr-only">Icebreaker tracker</h1>

    <!-- Not a live region. The counts are a summary of the roster below, and
         announcing all three on every change buried the one fact that actually
         changed; #srStatus speaks that single sentence instead. -->
    <div class="stats" role="group" aria-label="Counts">
      <div class="stat">
        <div class="n" id="s-present">0</div>
        <div class="l">In the room</div>
      </div>
      <div class="stat">
        <div class="n" id="s-done">0</div>
        <div class="l">Introduced</div>
      </div>
      <div class="stat">
        <div class="n" id="s-wait">0</div>
        <div class="l">Still to go</div>
      </div>
    </div>

    <div id="calloutBox" role="status"></div>

    <!-- A real list, and not a live region: app.js rewrites this wholesale on
         every frame, so aria-live here re-read the entire roster on each change
         (and the Zoom poller can fire that every 5s). -->
    <ul class="roster" id="roster"></ul>

    <!-- One sentence per change, for assistive tech only. -->
    <p class="sr-only" id="srStatus" role="status" aria-live="polite"></p>
    <p class="sr-only" id="reorderHint">
      Press the up or down arrow key to move this person in the order.
    </p>
  </main>

  <footer>
    <form class="add-row" id="addForm" autocomplete="off">
      <input id="addName" type="text" placeholder="Add someone by name&hellip;" aria-label="Add participant by name" />
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="footer-actions">
      <button class="btn ghost" id="randomBtn" type="button">Randomize order</button>
      <button class="btn ghost" id="resetBtn" type="button">Reset session</button>
    </div>
  </footer>

  <!-- Four skies, one tracker. A page preference rather than a session
       control, so it sits below the working surface. Native radio inputs —
       the browser owns the group semantics, the single tab stop, and the
       arrow keys, all working before theme.js loads; the module only
       applies the choice and persists it to localStorage, and the head
       script re-applies it before paint on the next load. -->
  <fieldset class="theme-bar" id="themeBar">
    <legend class="sr-only">Color theme</legend>
    <span class="theme-bar-label" aria-hidden="true">Theme</span>
    <label class="theme-chip">
      <input type="radio" name="theme" value="sky" checked />
      <span class="theme-swatch" aria-hidden="true"></span>Clear sky
    </label>
    <label class="theme-chip">
      <input type="radio" name="theme" value="dawn" />
      <span class="theme-swatch" aria-hidden="true"></span>Dawn
    </label>
    <label class="theme-chip">
      <input type="radio" name="theme" value="dusk" />
      <span class="theme-swatch" aria-hidden="true"></span>Golden hour
    </label>
    <label class="theme-chip">
      <input type="radio" name="theme" value="night" />
      <span class="theme-swatch" aria-hidden="true"></span>After dark
    </label>
  </fieldset>

  <div class="sponsor-bar">
    <!-- A plain link, not the sponsors iframe: an embedded iframe phones
         github.com on every page load, which the privacy promise rules out. -->
    <a class="sponsor" href="https://github.com/sponsors/rlorenzo" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.2C5.2 10.9 2.8 8.9 2.8 6.4 2.8 4.7 4.1 3.4 5.7 3.4c.9 0 1.8.5 2.3 1.3.5-.8 1.4-1.3 2.3-1.3 1.6 0 2.9 1.3 2.9 3 0 2.5-2.4 4.5-5.2 6.8Z"/></svg>Sponsor this project</a>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
